name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    # Small arm64 pool -- m7g.large, 2 vCPU / 8 GiB (SCA-477). Pure Python: uv
    # sync, `inv lint`, `inv security`, `inv test`. No container build, no
    # bundler, no npm, so 8 GiB cannot plausibly bind.
    #
    # If this ever grows a container build or a Lambda bundling step, move it
    # back to `scntnms-ephemeral-arm64` in the same commit.
    runs-on: [self-hosted, scntnms-ephemeral-arm64-small]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install dependencies (hash-verified from uv.lock)
        run: uv sync --locked --group build

      - name: Lint
        run: uv run inv lint

      - name: Security
        run: uv run inv security

      - name: Test
        run: uv run inv test
