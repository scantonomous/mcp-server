[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scantonomous-mcp"
version = "0.3.9"
description = "Scantonomous MCP server for AI agent integration"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "mcp==1.28.1",
    "httpx==0.28.1",
    "keyring==25.7.0",
    "click==8.4.2",
    # Transitives pinned forward past specific CVEs. These live HERE, not in
    # [tool.uv] constraint-dependencies, because the documented install is
    # `pip install git+https://github.com/scantonomous/mcp-server.git`, which
    # resolves from this metadata and never reads [tool.uv]. Verified before
    # moving them: `uv pip install --dry-run ./mcp-server 'anyio==4.13.0'`
    # resolved happily, as did starlette 1.3.1, cryptography 50.0.0 and
    # python-multipart 0.0.31 -- so a uv-only constraint had never protected
    # anyone installing the package.
    #
    # Exact pins per this repo's pinning policy (pinstack rejects `>=`). The
    # advisory FLOOR is named beside each one so raising the pin never
    # silently rewrites what the fix required.
    "anyio==4.14.2",             # floor 4.14.2 - CVE-2026-63374, CVE-2026-64847
    "starlette==1.3.1",          # floor 1.3.1  - CVE-2026-54282, CVE-2026-54283
    "python-multipart==0.0.31",  # floor 0.0.31 - CVE-2026-53538, CVE-2026-53540
    "cryptography==50.0.0",      # floor 50.0.0 - GHSA-537c-gmf6-5ccf, CVE-2026-69247
    "pydantic-settings==2.14.2", # floor 2.14.2 - GHSA-4xgf-cpjx-pc3j
]

[project.scripts]
scantonomous-mcp = "scantonomous_mcp.cli:main"

[dependency-groups]
build = [
    "invoke==3.0.3",
    "pytest==9.1.1",
    "ruff==0.15.20",
    "pyright==1.1.411",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "detect-secrets==1.5.0",
    "pinstack==0.2.0",
    "hatchling==1.31.0",
]

# NOTE: [tool.uv] constraint-dependencies used to carry these four CVE pins.
# They moved into [project].dependencies above so the shipped metadata
# enforces them; a uv-only constraint never reached anyone installing the
# package (SCA-418, mcp-server#67).

[tool.hatch.build.targets.wheel]
packages = ["src/scantonomous_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "S", "SLF", "T20", "PLC", "PLE", "PLW"]
ignore = ["S603", "S607", "E501", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tasks.py" = ["ARG001", "S605", "T201"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
